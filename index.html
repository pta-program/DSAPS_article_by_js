<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="PTA 数据结构与算法题目集中文版题解与 C 语言实现说明">
  <title>DSAPS by C · PTA 题解</title>
  <script>
    (function () {
      var saved = localStorage.getItem('docsify-dark-mode');
      var dark = saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.classList.toggle('dark', dark);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    })();
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root {
      --theme-color: #6a5acd;
      --body-bg: #ffffff;
      --surface-bg: #ffffff;
      --sidebar-bg: #f7f7fb;
      --border-color: #e6e7f0;
      --text-color: #2f3345;
      --muted-color: #73788f;
      --code-bg: #f6f7fc;
    }

    html[data-theme='dark'] {
      --body-bg: #12131a;
      --surface-bg: #1c1f2e;
      --sidebar-bg: #171a27;
      --border-color: #2a2f4a;
      --text-color: #c8cbd8;
      --muted-color: #969bb1;
      --code-bg: #171a27;
    }

    html, body {
      background: var(--body-bg) !important;
      color: var(--text-color) !important;
    }

    body, .app-nav, .markdown-section, .sidebar, .search .search-container,
    .search .search-result, .pagination-item a, .github-corner {
      transition: background-color .2s ease, color .2s ease, border-color .2s ease;
    }

    .sidebar {
      background: var(--sidebar-bg) !important;
      border-right: 1px solid var(--border-color) !important;
    }

    .sidebar-nav {
      padding: 20px 18px 72px;
    }

    .sidebar-nav > ul > li > strong {
      display: block;
      margin: 20px 0 8px;
      color: var(--muted-color);
      font-size: .78rem;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .sidebar-nav > ul > li:first-child > strong {
      margin-top: 0;
    }

    .sidebar-nav ul li a {
      display: block;
      color: var(--text-color) !important;
      line-height: 1.45;
      padding: 5px 8px;
      white-space: normal;
      overflow: visible;
      text-overflow: clip;
      overflow-wrap: anywhere;
      border-radius: 7px;
    }

    .sidebar-nav ul li a:hover,
    .sidebar-nav ul li.active > a {
      background: rgba(106, 90, 205, .12);
      color: var(--theme-color) !important;
    }

    .markdown-section {
      max-width: 980px;
      color: var(--text-color) !important;
    }

    .markdown-section h1, .markdown-section h2, .markdown-section h3,
    .markdown-section h4, .markdown-section h5, .markdown-section h6,
    .markdown-section strong {
      color: var(--text-color) !important;
    }

    .markdown-section a {
      color: #7b68ee !important;
    }

    .markdown-section blockquote {
      border-left-color: var(--theme-color) !important;
      color: var(--muted-color) !important;
    }

    .markdown-section table tr,
    .markdown-section table th,
    .markdown-section table td {
      border-color: var(--border-color) !important;
    }

    .markdown-section table tr:nth-child(2n) {
      background-color: rgba(127, 127, 127, .06) !important;
    }

    .markdown-section code {
      background: rgba(106, 90, 205, .12) !important;
      color: #7b68ee !important;
    }

    .markdown-section pre,
    .markdown-section pre > code {
      background: var(--code-bg) !important;
      border: 1px solid var(--border-color);
      border-radius: 10px;
    }

    .markdown-section pre > code {
      color: var(--text-color) !important;
    }

    .search .search-container,
    .search .search-container .search {
      background: var(--surface-bg) !important;
      color: var(--text-color) !important;
    }

    .search input {
      background: var(--surface-bg) !important;
      border-color: var(--border-color) !important;
      color: var(--text-color) !important;
    }

    .search .search-keyword,
    .search .search-result-title {
      color: var(--theme-color) !important;
    }

    .pagination-item a {
      color: var(--theme-color) !important;
    }

    .darklight-btn {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 9999;
      width: 44px;
      height: 44px;
      padding: 0;
      border: 1px solid var(--border-color);
      border-radius: 50%;
      background: rgba(255, 255, 255, .86);
      box-shadow: 0 8px 24px rgba(31, 35, 56, .16);
      color: var(--text-color);
      cursor: pointer;
      font-size: 1.15rem;
      backdrop-filter: blur(12px);
    }

    html[data-theme='dark'] .darklight-btn {
      background: rgba(35, 38, 58, .9);
      box-shadow: 0 8px 24px rgba(0, 0, 0, .3);
    }

    .darklight-btn:hover {
      transform: translateY(-2px);
    }

    @media (max-width: 600px) {
      .darklight-btn {
        right: 16px;
        bottom: 16px;
      }
    }
  </style>
</head>
<body>
  <div id="app">正在加载题解……</div>
  <button id="darklight-toggle" class="darklight-btn" type="button" aria-label="切换暗黑模式" title="切换暗黑模式">🌙</button>

  <script>
    window.$docsify = {
      name: 'DSAPS by C',
      repo: 'https://github.com/pta-program/DSAPS_article_by_C',
      homepage: 'README.md',
      loadSidebar: true,
      alias: { '/.*/_sidebar.md': '/_sidebar.md' },
      subMaxLevel: 0,
      auto2top: true,
      relativePath: false,
      search: {
        placeholder: '🔍 搜索题号 / 关键词',
        noData: '没有找到结果',
        depth: 4
      },
      pagination: {
        previousText: '上一题',
        nextText: '下一题',
        crossChapter: true
      },
      count: {
        countable: true,
        language: 'chinese'
      },
      copyCode: {
        buttonText: '复制代码',
        errorText: '复制失败',
        successText: '已复制'
      }
    };

    (function () {
      var button = document.getElementById('darklight-toggle');
      var media = window.matchMedia('(prefers-color-scheme: dark)');

      function applyDark(dark, persist) {
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.body.classList.toggle('dark-mode', dark);
        button.textContent = dark ? '☀️' : '🌙';
        button.setAttribute('aria-label', dark ? '切换亮色模式' : '切换暗黑模式');
        button.title = dark ? '切换亮色模式' : '切换暗黑模式';
        if (persist) localStorage.setItem('docsify-dark-mode', dark ? 'dark' : 'light');
      }

      function currentDark() {
        return document.documentElement.dataset.theme === 'dark';
      }

      applyDark(currentDark(), false);
      button.addEventListener('click', function () { applyDark(!currentDark(), true); });
      document.addEventListener('keydown', function (event) {
        if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'd') {
          event.preventDefault();
          applyDark(!currentDark(), true);
        }
      });
      media.addEventListener && media.addEventListener('change', function (event) {
        if (!localStorage.getItem('docsify-dark-mode')) applyDark(event.matches, false);
      });
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@3"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/countable@3/dist/countable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-count@1/dist/countable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-c.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-cpp.min.js"></script>
</body>
</html>
